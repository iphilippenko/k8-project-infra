apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging-db-migration
  namespace: flux-system
spec:
  dependsOn:
    - name: staging-db
  interval: 10m
  path: ./infrastructure/migrations/staging
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
