apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging-db
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: cnpg-operator
  interval: 10m
  path: ./infrastructure/databases/staging
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
