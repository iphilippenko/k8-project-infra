apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: staging-app
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: ingress-nginx
    - name: staging-db
  interval: 10m
  path: ./overlays/staging
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
