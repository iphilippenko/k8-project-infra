apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: prod-app
  namespace: flux-system
spec:
  dependsOn:
    - name: namespaces
    - name: ingress-nginx
    - name: prod-db-migration
  interval: 10m
  path: ./overlays/production
  prune: true
  wait: true
  sourceRef:
    kind: GitRepository
    name: flux-system
